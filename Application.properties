# Use H2 in-memory DB for convenience.
spring.datasource.url=jdbc:h2:mem:nimbusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# If you prefer MySQL, replace the properties below and add mysql connector to pom.xml (uncommented)
# spring.datasource.url=jdbc:mysql://localhost:3306/nimbus_app?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.hibernate.ddl-auto=update

# Server port
server.port=8080
